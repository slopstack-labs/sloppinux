# Static checks: shellcheck, bash/zsh syntax, python byte-compile, JSON/JSONC,
# .desktop validation, and executable bits. All logic lives in scripts/lint.sh
# so it runs identically on a laptop; CI just installs every tool and passes
# --strict so a missing tool fails instead of being skipped.
name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck zsh desktop-file-utils python3 python3-yaml

      - name: Run scripts/lint.sh
        run: scripts/lint.sh --strict
